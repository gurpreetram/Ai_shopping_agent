[project]
name = "shoping-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gurpreet Ram", email = "gurupreetram080@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "ipykernel>=7.4.0",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.0",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "notebook>=7.6.3",
    "pypdf>=6.21.3",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
]

[project.scripts]
shoping-agent = "shoping_agent:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
